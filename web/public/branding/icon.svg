<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Stethoscope circle (gold) -->
  <circle cx="108" cy="88" r="72" stroke="#C5993E" stroke-width="7" fill="none"/>
  <!-- Stethoscope tube curving down to earpiece -->
  <path d="M36 88 C36 140, 40 158, 50 168" stroke="#C5993E" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- Earpiece circle -->
  <circle cx="50" cy="176" r="9" stroke="#C5993E" stroke-width="5" fill="none"/>
  <!-- Horseshoe (maroon) - U shape opening upward, wide and round -->
  <path d="M70 60 C62 80, 60 110, 68 135 C72 145, 80 148, 88 148 L88 148" stroke="#8B1A2B" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M146 60 C154 80, 156 110, 148 135 C144 145, 136 148, 128 148 L128 148" stroke="#8B1A2B" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Horseshoe bottom connector -->
  <path d="M88 148 Q108 155, 128 148" stroke="#8B1A2B" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- Horseshoe nail holes - along the inner curve, left side -->
  <circle cx="72" cy="78" r="3.5" fill="#8B1A2B"/>
  <circle cx="68" cy="98" r="3.5" fill="#8B1A2B"/>
  <circle cx="68" cy="118" r="3.5" fill="#8B1A2B"/>
  <!-- Horseshoe nail holes - right side -->
  <circle cx="144" cy="78" r="3.5" fill="#8B1A2B"/>
  <circle cx="148" cy="98" r="3.5" fill="#8B1A2B"/>
  <circle cx="148" cy="118" r="3.5" fill="#8B1A2B"/>
</svg>

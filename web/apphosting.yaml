# Firebase App Hosting configuration for the demo project.
#
# Firebase API keys and project identifiers are NOT secrets — they're public
# routing identifiers. Real security lives in Firebase Security Rules and
# App Check. Values here are safe to commit.
#
# For customer forks: copy this file, replace values with your customer's
# Firebase project config, and move any sensitive keys (Stripe live keys,
# third-party API tokens) to Secret Manager via `secret: NAME` instead of
# `value:`. Omit any variables you don't use — App Hosting rejects empty
# string values, so there's no "unset" sentinel.

env:
  # Firebase config
  #
  # VITE_FIREBASE_API_KEY is NOT actually secret (Firebase Web API keys are
  # public routing identifiers — real security is via Firebase Rules + App
  # Check). But we route it through Secret Manager anyway to:
  #   1. avoid GitHub's secret scanner false positive
  #   2. keep the same posture as showmd-patient production
  #   3. make it easier to rotate without committing a new value
  #
  # To set the secret value: `echo -n "AIzaSy..." | gcloud secrets create \
  #   VITE_FIREBASE_API_KEY --project=<project> --data-file=-`
  - variable: VITE_FIREBASE_API_KEY
    secret: VITE_FIREBASE_API_KEY
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: patient-demo-project.firebaseapp.com
  - variable: VITE_FIREBASE_PROJECT_ID
    value: patient-demo-project
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: patient-demo-project.firebasestorage.app
  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "29134217143"
  - variable: VITE_FIREBASE_APP_ID
    value: "1:29134217143:web:070111ca71126265475232"

  # App config
  - variable: VITE_SANDBOX_MODE
    value: "true"
  - variable: VITE_APP_ENV
    value: demo
  - variable: VITE_STRIPE_PUBLIC_KEY
    value: pk_test_replace_me
